name: Algo não funciona
description: Relate um bug
labels: [bug]
body:
  - type: textarea
    id: oque
    attributes: { label: O que aconteceu, description: E o que você esperava que acontecesse. }
    validations: { required: true }
  - type: textarea
    id: passos
    attributes: { label: Como reproduzir, placeholder: "1. ...\n2. ...\n3. ..." }
    validations: { required: true }
  - type: input
    id: ambiente
    attributes: { label: Ambiente, placeholder: "Docker ou Node 24, navegador, sistema" }
  - type: textarea
    id: logs
    attributes: { label: Logs ou prints, render: text }
