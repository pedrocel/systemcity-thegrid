# Análise de segurança do código JavaScript (CodeQL) em todo push, Pull Request e uma vez por semana.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config: |
            paths-ignore:
              - engine/vendor
      - uses: github/codeql-action/analyze@v3
